[SERVICE]
    Flush                 5
    Log_Level             info
    storage.path          /fluent-bit/state/buffer

[INPUT]
    Name                  forward
    Listen                0.0.0.0
    Port                  24224
    storage.type          filesystem

# Derive a stream prefix from each container name; preserve the original field.
# Names differing only in case/punctuation can normalize to the same stream.
[FILTER]
    Name                  lua
    Match                 docker.*
    Call                  container_stream
    Code                  function container_stream(tag, timestamp, record) local n = record["container_name"]; if type(n) ~= "string" then n = "" end; n = n:gsub("^/+", ""):lower():gsub("[^a-z0-9_]", "_"); if n == "" then n = "unknown_container" end; record["stream_prefix"] = n; return 2, timestamp, record end

[OUTPUT]
    Name                  es
    Match                 docker.*
    Host                  openobserve
    Port                  5080
    Path                  /api/default
    Logstash_Format       On
    Logstash_Prefix       unknown_container
    Logstash_Prefix_Key   $stream_prefix
    Logstash_Prefix_Separator _
    Logstash_DateFormat   logs
    HTTP_User             ${ZO_ROOT_USER_EMAIL}
    HTTP_Passwd           ${ZO_ROOT_USER_PASSWORD}
    tls                   Off
    Suppress_Type_Name    On
    Generate_ID           Off
    Retry_Limit           False
    storage.total_limit_size 256M
